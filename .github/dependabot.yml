version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
      timezone: Australia/Melbourne
    open-pull-requests-limit: 2
    groups:
      go-dependencies:
        patterns:
          - "*"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
      timezone: Australia/Melbourne
    open-pull-requests-limit: 2
    groups:
      github-actions:
        patterns:
          - "*"
