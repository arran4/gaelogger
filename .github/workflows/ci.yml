name: CI/CD

on:
  push:
    branches: [main, master]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main, master]
  workflow_dispatch:
  schedule:
    - cron: '17 3 1 * *'

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Go tests and module verification
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.x'
          cache: false
      - name: Verify gofmt formatting
        shell: bash
        run: |
          unformatted="$(gofmt -l .)"
          if [[ -n "$unformatted" ]]; then
            echo "$unformatted"
            exit 1
          fi
      - name: Verify dependency integrity
        run: |
          go mod verify
          go mod tidy -diff
      - name: Unit tests with race detection
        run: go test -race ./...
      - name: Static analysis
        run: go vet ./...

  lint:
    name: Go lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.x'
          cache: false
      - uses: golangci/golangci-lint-action@v9
        with:
          version: latest
          skip-cache: true

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release:
    name: Publish a versioned GitHub release
    needs: [test, lint, secrets]
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Release only when VERSION changed
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BEFORE: ${{ github.event.before }}
          TARGET: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ ! -f VERSION ]]; then
            echo 'No VERSION file; nothing to release.'
            exit 0
          fi
          version="$(tr -d '[:space:]' < VERSION)"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::VERSION must contain stable semver (major.minor.patch)."
            exit 1
          fi
          if [[ ! "$BEFORE" =~ ^[0-9a-f]{40}$ ]] || ! git diff --name-only "$BEFORE" "$TARGET" | grep -Fxq VERSION; then
            echo 'VERSION unchanged; no release required.'
            exit 0
          fi
          tag="v$version"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "::error::Release $tag already exists, but VERSION was changed."
            exit 1
          fi
          gh release create "$tag" --target "$TARGET" --title "$tag" --generate-notes
          gh release view "$tag" --json tagName,isDraft,isPrerelease,url
