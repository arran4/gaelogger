name: One-off full dependency refresh

on:
  push:
    branches: [maintenance/dependencies-release-20261115]
    paths:
      - .github/workflows/dependency-update.yml

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.x'
          cache: false
      - name: Upgrade selected Go dependency graph and verify
        shell: bash
        run: |
          set -euo pipefail
          go version
          go mod edit -go=1.27.0
          go get cloud.google.com/go/logging@latest
          go get -u ./...
          go mod tidy
          go mod verify
          go test -race ./...
          go vet ./...
          echo 'Newest versions not selected by the tidy module graph (informational):'
          go list -m -u all | grep -E ' \[v[0-9]' || true
          git diff --check
      - name: Commit generated module and checksum updates
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add go.mod go.sum
          if ! git diff --cached --quiet; then
            git commit -m 'chore(deps): upgrade complete selected Go dependency graph'
            git fetch origin maintenance/dependencies-release-20261115
            git rebase origin/maintenance/dependencies-release-20261115
            git push origin HEAD:maintenance/dependencies-release-20261115
          fi
