name: One-off full dependency refresh

on:
  push:
    branches: [maintenance/dependencies-release-20261115]
    paths:
      - .github/workflows/dependency-update.yml

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.x'
          cache: false
      - name: Upgrade complete Go module graph and verify
        shell: bash
        run: |
          set -euo pipefail
          go version
          go mod edit -go=1.27.0
          go get cloud.google.com/go/logging@latest
          go get -u ./...
          go mod tidy
          for round in 1 2 3; do
            mapfile -t updates < <(go list -m -u all | awk '$3 ~ /^\[v/ { v=$3; gsub(/\[|\]/,"",v); print $1 "@" v }')
            if (( ${#updates[@]} == 0 )); then
              break
            fi
            printf 'Updating still-outdated modules (round %d): %s\n' "$round" "${updates[*]}"
            go get "${updates[@]}"
            go mod tidy
          done
          echo 'Remaining newer module versions (should be empty):'
          if go list -m -u all | grep -E ' \[v[0-9]'; then
            echo '::error::Some modules remain outdated after upgrades.'
            exit 1
          fi
          go mod verify
          go test -race ./...
          go vet ./...
          git diff --check
      - name: Commit generated module and checksum updates
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add go.mod go.sum
          if ! git diff --cached --quiet; then
            git commit -m 'chore(deps): upgrade complete Go module graph'
            git fetch origin maintenance/dependencies-release-20261115
            git rebase origin/maintenance/dependencies-release-20261115
            git push origin HEAD:maintenance/dependencies-release-20261115
          fi
